# 串口文件传输配置
# ==================

# 串口配置
serial_config:
  # 通用串口参数
  baudrate: 921600      # 波特率 (115200, 460800, 921600, 1728000)
  bytesize: 8           # 数据位
  parity: "none"        # 校验位 (none, even, odd)
  stopbits: 1           # 停止位
  timeout: 0.2          # 串口超时 (秒) - 优化高速传输稳定性

# 传输配置
transfer_config:
  # 块长配置（vNext：固定配置，不再动态调整）
  max_data_length: 4096   # 单次传输最大数据长度 (字节)
                          # 推荐值: 115200波特率->1024, 921600->2048, 1728000->4096
                          # 范围: 512-16384字节
  
  # 超时配置
  request_timeout: 30     # 请求超时时间 (秒) - 等待接收端启动时间
  connection_timeout: 30  # 连接建立超时时间 (秒) - 初始握手阶段
  data_timeout: 5         # 数据传输超时时间 (秒) - 传输过程中快速响应
  
  # 重试配置
  retry_count: 3          # 快速重试次数（降回3次，配合新的重试策略）
  backoff_base: 0.5       # 指数退避基础秒数
  max_retries: 5          # 最大重试次数（硬件恢复阶段）
  
  # 其他配置
  show_progress: true     # 是否显示进度条
  max_cache_size: 4194304 # 流式读取阈值 (4MB)
  
  # 序号恢复配置
  sequence_mismatch_threshold: 3  # 序号不匹配阈值
  sync_timeout: 2                 # 序号同步超时(秒)
  enable_sequence_recovery: true  # 启用序号恢复机制

# 注意：实际使用时串口号通过交互界面选择或命令行参数指定
# 此配置文件主要用于设置传输参数（波特率、块大小等）

# === vNext 版本配置说明 ===
#
# 推荐的波特率与块大小搭配：
# 9600-57600   -> 512 字节  (低速链路)
# 115200-460800 -> 1024 字节 (中速链路)
# 921600        -> 2048 字节 (高速链路)
# 1000000-1500000 -> 4096 字节 (超高速链路)
# 1728000       -> 4096-8192 字节 (当前配置，需根据硬件调整)
#
# vNext 版本变更：
# 1. 删除自适应块长策略 - 块长由配置文件固定，简化逻辑
# 2. 新增offset字段 - 数据帧包含偏移量，解决ACK丢失死锁
# 3. 重复帧幂等处理 - 接收端识别重复帧，重发ACK但不重复写入
# 4. 统一重试流程 - 快速重试 → 序号同步 → 硬件恢复
# 5. 状态机架构 - 明确的双端状态转移，可测试性提升
#
# 如何选择块长：
# 1. 初次使用：参考上述推荐值
# 2. 观察日志：若重试率 > 5%，降低块长
# 3. 性能调优：若重试率 < 1% 且速率未饱和，可尝试增大
# 4. 硬件限制：某些串口芯片对大块长支持不佳，建议从小块长开始
