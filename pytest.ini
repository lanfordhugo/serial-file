[tool:pytest]
# 测试路径和文件发现 - 排除集成测试
testpaths = tests
python_files = test_*.py
python_functions = test_*

# 默认执行选项 - 包含覆盖率和质量门禁，排除集成测试
addopts = -v --tb=short --cov=src/serial_file_transfer --cov-report=term-missing --cov-report=html --cov-fail-under=80 -m "not integration and not slow" --ignore=tests/integration

# 排除集成测试目录
norecursedirs = tests/integration

# 超时设置
timeout = 60
timeout_method = signal

# 测试标记定义
markers =
    slow: 标记慢速测试，通常需要较长时间执行
    integration: 标记集成测试，需要外部依赖或硬件，默认不执行
    hardware: 标记需要真实硬件的测试，仅在有硬件环境时执行

# 覆盖率配置
[coverage:run]
source = src/serial_file_transfer
omit = 
    */tests/*
    */test_*
    */__pycache__/*
    */conftest.py

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    if self.debug:
    if settings.DEBUG
    raise AssertionError
    raise NotImplementedError
    if 0:
    if __name__ == .__main__.: