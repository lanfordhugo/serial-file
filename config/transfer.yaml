# 串口文件传输配置
# ==================

# 串口配置
serial_config:
  # 通用串口参数
  baudrate: 1728000      # 波特率 (115200, 460800, 921600, 1728000)
  bytesize: 8           # 数据位
  parity: "none"        # 校验位 (none, even, odd)
  stopbits: 1           # 停止位
  timeout: 0.05         # 串口超时 (秒) - 高速串口优化

# 传输配置
transfer_config:
  max_data_length: 16384  # 单次传输最大数据长度 (字节) - 适合高速波特率
  request_timeout: 0.2    # 请求超时时间 (秒) - 高速串口优化
  retry_count: 3          # 重试次数
  backoff_base: 0.5       # 指数退避基础秒数
  show_progress: true     # 是否显示进度条
  max_cache_size: 4194304 # 流式读取阈值 (4MB)
  max_retries: 5          # 最大重试次数

# 注意：实际使用时串口号通过交互界面选择或命令行参数指定
# 此配置文件主要用于设置传输参数（波特率、块大小等）

# 推荐的波特率与块大小搭配（以获得最佳性能）：
# 115200   -> 1024 字节
# 460800   -> 1024 字节  
# 921600   -> 2048 字节
# 1728000  -> 16384 字节 (当前配置)
# 
# 原则：高波特率使用大块可以减少协议开销，提高传输效率
