# 串口文件传输配置
# ==================

# 串口配置
serial_config:
  # 通用串口参数
  baudrate: 1728000      # 波特率 (115200, 460800, 921600, 1728000)
  bytesize: 8           # 数据位
  parity: "none"        # 校验位 (none, even, odd)
  stopbits: 1           # 停止位
  timeout: 0.2          # 串口超时 (秒) - 优化高速传输稳定性

# 传输配置
transfer_config:
  max_data_length: 4096   # 单次传输最大数据长度 (字节) - 稳定性优化
  request_timeout: 30     # 请求超时时间 (秒) - 等待接收端启动时间
  connection_timeout: 30  # 连接建立超时时间 (秒) - 初始握手阶段
  data_timeout: 5         # 数据传输超时时间 (秒) - 传输过程中快速响应
  retry_count: 5          # 重试次数 - 增强容错性
  backoff_base: 0.3       # 指数退避基础秒数 - 更快重试
  show_progress: true     # 是否显示进度条
  max_cache_size: 4194304 # 流式读取阈值 (4MB)
  max_retries: 10         # 最大重试次数 - 增强容错性

# 注意：实际使用时串口号通过交互界面选择或命令行参数指定
# 此配置文件主要用于设置传输参数（波特率、块大小等）

# 推荐的波特率与块大小搭配（稳定性优化后）：
# 115200   -> 1024 字节
# 460800   -> 1024 字节  
# 921600   -> 2048 字节
# 1728000  -> 4096 字节 (当前配置 - 稳定性优化)
# 
# 原则：平衡传输效率与稳定性，减小块大小提高传输成功率
# 
