# 串口文件传输配置
# ==================
# 本配置文件定义了串口通信和文件传输的所有参数

# 串口配置
serial_config:
  # 波特率 - 通信速度（推荐：115200-460800 稳定，921600+ 需优质硬件）
  baudrate: 460800
  
  # 数据位
  bytesize: 8
  
  # 校验位 (none/even/odd)
  parity: "none"
  
  # 停止位
  stopbits: 1
  
  # 超时时间（秒）
  timeout: 0.2

# 传输配置
transfer_config:
  # 单次传输最大数据长度（字节）- vNext版本采用固定块长
  # 460800: 推荐 2048-4096
  # 921600: 推荐 512-1024（高速不稳定时降低）
  # 1728000: 推荐 8192（需优质硬件支持）
  max_data_length: 2048
  
  # 请求超时时间（秒）- 用于初始连接和数据请求
  request_timeout: 30
  
  # 连接建立超时时间（秒）
  connection_timeout: 30
  
  # 数据传输超时时间（秒）
  data_timeout: 5
  
  # 重试次数 - 单次数据块传输失败后的重试次数
  retry_count: 3
  
  # 最大重试次数 - 整体传输失败后的最大重试次数
  max_retries: 5
  
  # 指数退避基础秒数 - 重试时的延迟时间基数
  backoff_base: 0.5
  
  # 是否显示进度条
  show_progress: true
  
  # 触发流式读取阈值（4MB）
  max_cache_size: 4194304
  
  # ===== 序号恢复机制配置 =====
  
  # 序号不匹配阈值 - 连续不匹配多少次后触发序号同步
  sequence_mismatch_threshold: 3
  
  # 序号同步超时时间（秒）
  sync_timeout: 2
  
  # 是否启用序号恢复机制
  enable_sequence_recovery: true

# ===== vNext 版本配置说明 =====
# 1. 已删除自适应传输策略，使用固定块长配置
# 2. max_data_length 应根据波特率调整：
#    - 115200:  512-1024  (最稳定)
#    - 460800:  2048-4096 (推荐)
#    - 921600:  512-1024  (高速但可能不稳定)
#    - 1728000: 8192      (需优质硬件)
# 3. 高波特率传输失败时，建议：
#    - 降低 max_data_length
#    - 增加 request_timeout 和 retry_count
#    - 或降低 baudrate 至稳定值（460800）
